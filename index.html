<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Splitter - Tách HTML/CSS/JS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg:#0f1117; --panel:#181b24; --panel-2:#1f2330; --border:#2a3040;
    --text:#e4e7ee; --muted:#8b93a7; --accent:#6c8cff; --accent-2:#4a6cf7;
    --green:#3ddc84; --orange:#ffb454; --red:#ff5c5c; --purple:#b48cff;
  }
  body {
    font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg);
    color:var(--text); min-height:100vh; display:flex; flex-direction:column;
  }
  header {
    background:linear-gradient(135deg,#1a1e2e,#141822);
    border-bottom:1px solid var(--border); padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:12px;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo {
    width:40px; height:40px; background:linear-gradient(135deg,var(--accent),var(--purple));
    border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:bold; box-shadow:0 4px 14px rgba(108,140,255,.35);
  }
  .brand h1 { font-size:18px; font-weight:600; }
  .brand p { font-size:12px; color:var(--muted); margin-top:2px; }
  .header-actions { display:flex; gap:10px; flex-wrap:wrap; }
  .btn {
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    padding:10px 18px; border-radius:8px; cursor:pointer; font-size:13px;
    font-weight:500; transition:all .18s; display:inline-flex; align-items:center;
    gap:8px; font-family:inherit;
  }
  .btn:hover { background:#262b3b; border-color:#3a4155; transform:translateY(-1px); }
  .btn.primary {
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border:none; box-shadow:0 4px 14px rgba(108,140,255,.3);
  }
  .btn.green {
    background:linear-gradient(135deg,#2fb96a,#26a058); border:none;
    box-shadow:0 4px 14px rgba(61,220,132,.25);
  }
  .btn.danger { background:linear-gradient(135deg,#ff5c5c,#e04444); border:none; }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none !important; }
  .workspace {
    flex:1; display:grid; grid-template-columns:1fr 1fr; gap:16px;
    padding:16px; min-height:0;
  }
  .pane {
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    display:flex; flex-direction:column; overflow:hidden; min-height:0;
  }
  .pane-header {
    padding:10px 14px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; background:var(--panel-2); flex-wrap:wrap;
  }
  .pane-title { font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .dot.green { background:var(--green); }
  .stats { font-size:11px; color:var(--muted); display:flex; gap:12px; }
  .pane-body { flex:1; overflow:auto; position:relative; display:flex; flex-direction:column; }

  /* ===== INPUT AREA ===== */
  .input-toolbar {
    padding:10px 14px; border-bottom:1px solid var(--border);
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    background:var(--panel-2);
  }
  .file-name {
    font-size:12px; color:var(--green); margin-left:auto;
    display:flex; align-items:center; gap:6px; max-width:280px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  textarea {
    width:100%; flex:1; background:transparent; border:none; color:var(--text);
    padding:16px; font-family:'Consolas','Monaco',monospace; font-size:13px;
    line-height:1.6; resize:none; outline:none; tab-size:2; min-height:0;
  }
  textarea::placeholder { color:#4a5163; }

  /* ===== OUTPUT AREA ===== */
  .tabs { display:flex; gap:4px; }
  .tab {
    padding:7px 14px; border-radius:7px; background:transparent;
    border:1px solid transparent; color:var(--muted); font-size:12px;
    cursor:pointer; font-weight:500; transition:all .15s; font-family:inherit;
  }
  .tab:hover { color:var(--text); background:#262b3b; }
  .tab.active { background:var(--bg); color:var(--text); border-color:var(--border); }
  .tab .badge {
    display:inline-block; font-size:10px; padding:1px 6px; border-radius:4px;
    margin-left:6px; background:var(--accent); color:#fff;
  }
  .tab.html .badge { background:var(--orange); color:#000; }
  .tab.js .badge { background:var(--green); color:#000; }
  .output-content {
    flex:1; overflow:auto; padding:16px; font-family:'Consolas','Monaco',monospace;
    font-size:13px; line-height:1.6; white-space:pre; color:#cdd3e0; tab-size:2;
  }
  .output-content.empty::before {
    content:'Kết quả tách code sẽ xuất hiện ở đây...';
    color:#4a5163; font-family:'Segoe UI',sans-serif;
  }
  .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .checkbox { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer; user-select:none; }
  .checkbox input { accent-color:var(--accent); cursor:pointer; }
  .copy-btn {
    padding:6px 12px; font-size:11px; border-radius:6px; background:var(--panel-2);
    border:1px solid var(--border); color:var(--muted); cursor:pointer;
    transition:all .15s; font-family:inherit;
  }
  .copy-btn:hover { color:var(--text); border-color:var(--accent); }

  /* ===== TOAST ===== */
  .toast {
    position:fixed; bottom:24px; right:24px; background:var(--panel-2);
    border:1px solid var(--border); border-left:4px solid var(--green);
    padding:14px 20px; border-radius:8px; font-size:13px;
    box-shadow:0 8px 32px rgba(0,0,0,.4); transform:translateX(120%);
    transition:transform .3s; z-index:9999; max-width:360px;
  }
  .toast.show { transform:translateX(0); }
  .toast.error { border-left-color:var(--red); }

  /* ===== SPINNER ===== */
  @keyframes spin { to { transform:rotate(360deg); } }
  .spinner {
    display:inline-block; width:14px; height:14px;
    border:2px solid rgba(255,255,255,.3); border-top-color:#fff;
    border-radius:50%; animation:spin .7s linear infinite;
  }

  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#2a3040; border-radius:5px; border:2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover { background:#3a4155; }

  @media (max-width:900px) {
    .workspace { grid-template-columns:1fr; grid-template-rows:1fr 1fr; }
    header { padding:14px 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">⚡</div>
    <div>
      <h1>Code Splitter</h1>
      <p>Tách HTML thành 3 file: index.html + style.css + script.js</p>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn danger" id="clearBtn">🗑️ Xóa</button>
    <button class="btn" id="sampleBtn">📝 Load mẫu</button>
    <button class="btn primary" id="splitBtn">⚡ Tách code</button>
    <button class="btn green" id="downloadBtn" disabled>⬇️ Tải ZIP</button>
  </div>
</header>

<main class="workspace">
  <!-- ========== LEFT: INPUT ========== -->
  <section class="pane">
    <div class="pane-header">
      <div class="pane-title">
        <span class="dot"></span>
        <span>Input</span>
      </div>
      <div class="stats" id="inputStats"><span>0 dòng</span><span>0 ký tự</span></div>
    </div>

    <!-- TOOLBAR LUÔN HIỆN -->
    <div class="input-toolbar">
      <button class="btn primary" id="pickFileBtn" type="button">📁 Chọn file</button>
      <button class="btn" id="pasteBtn" type="button">📋 Paste</button>
      <span class="file-name" id="fileName">Chưa chọn file</span>
      <!-- INPUT FILE ẨN NHƯNG LUÔN TỒN TẠI TRONG DOM -->
      <input type="file" id="fileInput" accept=".html,.htm,.txt,text/html,text/plain" style="position:absolute;left:-9999px;">
    </div>

    <div class="pane-body">
      <textarea id="inputCode" placeholder="Paste code HTML vào đây hoặc bấm '📁 Chọn file' ở trên...&#10;&#10;Tool sẽ tự tách:&#10;  • <style>...</style>      →  style.css&#10;  • <script>...</script>    →  script.js&#10;  • Phần còn lại            →  index.html&#10;&#10;Hỗ trợ .html, .htm, .txt (tối đa 5MB)"></textarea>
    </div>
  </section>

  <!-- ========== RIGHT: OUTPUT ========== -->
  <section class="pane">
    <div class="pane-header">
      <div class="tabs">
        <button class="tab html active" data-tab="html">📄 index.html <span class="badge" id="htmlCount">0</span></button>
        <button class="tab css" data-tab="css">🎨 style.css <span class="badge" id="cssCount">0</span></button>
        <button class="tab js" data-tab="js">⚙️ script.js <span class="badge" id="jsCount">0</span></button>
      </div>
      <div class="controls">
        <label class="checkbox">
          <input type="checkbox" id="linkFiles" checked>
          Link file tự động
        </label>
        <button class="copy-btn" id="copyBtn" type="button">📋 Copy</button>
      </div>
    </div>
    <div class="pane-body">
      <div class="output-content empty" id="output"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   STATE
   ========================================================= */
const state = {
  fileName: '',
  input: '',
  result: { html: '', css: '', js: '' },
  activeTab: 'html',
  ready: false
};

/* =========================================================
   DOM REFS
   ========================================================= */
const $ = (id) => document.getElementById(id);
const inputCode    = $('inputCode');
const fileInput    = $('fileInput');
const pickFileBtn  = $('pickFileBtn');
const pasteBtn     = $('pasteBtn');
const fileNameEl   = $('fileName');
const output       = $('output');
const splitBtn     = $('splitBtn');
const downloadBtn  = $('downloadBtn');
const clearBtn     = $('clearBtn');
const sampleBtn    = $('sampleBtn');
const copyBtn      = $('copyBtn');
const toast        = $('toast');
const inputStats   = $('inputStats');
const linkFiles    = $('linkFiles');

/* =========================================================
   TOAST
   ========================================================= */
let toastTimer = null;
function showToast(msg, isError = false) {
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.className = 'toast' + (isError ? ' error' : '');
  }, 3500);
}

/* =========================================================
   STATS
   ========================================================= */
function updateInputStats() {
  const text = inputCode.value;
  const lines = text ? text.split('\n').length : 0;
  inputStats.innerHTML = `<span>${lines.toLocaleString()} dòng</span><span>${text.length.toLocaleString()} ký tự</span>`;
}

/* =========================================================
   FILE PICKER  ← FIX CHÍNH
   ========================================================= */
// Bấm nút → mở hộp thoại chọn file
pickFileBtn.addEventListener('click', (e) => {
  e.preventDefault();
  fileInput.value = ''; // reset để có thể chọn lại cùng 1 file
  fileInput.click();
});

// Khi chọn file
fileInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (file) readFile(file);
});

// Paste từ clipboard
pasteBtn.addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (!text) { showToast('⚠️ Clipboard trống', true); return; }
    inputCode.value = text;
    state.input = text;
    state.fileName = '';
    fileNameEl.textContent = '📋 Từ clipboard';
    updateInputStats();
    showToast('✅ Đã paste ' + text.length + ' ký tự');
  } catch {
    showToast('❌ Không đọc được clipboard (cần HTTPS hoặc quyền)', true);
  }
});

// Đọc file
function readFile(file) {
  const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
  const validExt = ['.html', '.htm', '.txt'];

  if (!validExt.includes(ext)) {
    showToast('❌ Chỉ hỗ trợ .html, .htm, .txt', true);
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    showToast('❌ File quá lớn (max 5MB)', true);
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    state.fileName = file.name;
    state.input = e.target.result;
    inputCode.value = state.input;
    fileNameEl.textContent = '📄 ' + file.name + ' (' + (file.size/1024).toFixed(1) + ' KB)';
    updateInputStats();
    showToast(`✅ Đã tải: ${file.name}`);
  };
  reader.onerror = () => showToast('❌ Lỗi đọc file', true);
  reader.readAsText(file, 'UTF-8');
}

// Drag & drop lên textarea
inputCode.addEventListener('dragover', (e) => { e.preventDefault(); });
inputCode.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (file) readFile(file);
});

// Gõ tay
inputCode.addEventListener('input', () => {
  state.input = inputCode.value;
  if (state.fileName) {
    state.fileName = '';
    fileNameEl.textContent = '✏️ Đang chỉnh sửa';
  }
  updateInputStats();
});

/* =========================================================
   CORE SPLIT
   ========================================================= */
function splitCode(rawInput) {
  let code = (rawInput || '').replace(/\r\n?/g, '\n');

  if (!code.trim()) return { error: 'Không có nội dung để tách' };

  const hasHtmlTag = /<html[\s>]/i.test(code) || /<!doctype/i.test(code);
  const styles = [];
  const scripts = [];

  // Tách <style>
  let tempCode = code.replace(/<style\b[^>]*>([\s\S]*?)<\/style>/gi, (m, content) => {
    if (content && content.trim()) styles.push(content.trim());
    return '';
  });

  // Tách <script> KHÔNG có src
  tempCode = tempCode.replace(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi, (match, attrs, content) => {
    const hasSrc = /\bsrc\s*=/i.test(attrs);
    if (hasSrc) return match; // giữ nguyên script external
    if (content && content.trim()) scripts.push(content.trim());
    return '';
  });

  const css = styles.join('\n\n/* ---- ---- ---- */\n\n');
  const js  = scripts.join('\n\n/* ---- ---- ---- */\n\n');

  let html = tempCode;
  if (!hasHtmlTag) {
    html = '<!DOCTYPE html>\n<html lang="vi">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>Document</title>\n</head>\n<body>\n\n' + html + '\n\n</body>\n</html>';
  }
  html = html.replace(/\n{3,}/g, '\n\n').trim();

  const shouldLink = linkFiles.checked;

  if (shouldLink) {
    if (css) {
      if (/<\/head>/i.test(html)) html = html.replace(/<\/head>/i, '  <link rel="stylesheet" href="style.css">\n</head>');
    }
    if (js) {
      if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, '  <script src="script.js"><\/script>\n</body>');
      else html += '\n<script src="script.js"><\/script>';
    }
  }

  return { html: html.trim(), css: css.trim(), js: js.trim(), error: null };
}

/* =========================================================
   RENDER OUTPUT
   ========================================================= */
function renderOutput() {
  const tab = state.activeTab;
  const content = state.result[tab];

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));

  output.classList.remove('empty');
  if (content) {
    output.textContent = content;
  } else {
    output.classList.add('empty');
    output.textContent = '';
  }

  $('htmlCount').textContent = state.result.html ? state.result.html.split('\n').length : 0;
  $('cssCount').textContent  = state.result.css  ? state.result.css.split('\n').length  : 0;
  $('jsCount').textContent   = state.result.js   ? state.result.js.split('\n').length   : 0;

  downloadBtn.disabled = !(state.result.html || state.result.css || state.result.js);
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.activeTab = tab.dataset.tab;
    renderOutput();
  });
});

/* =========================================================
   SPLIT ACTION
   ========================================================= */
splitBtn.addEventListener('click', () => {
  const raw = inputCode.value;
  if (!raw.trim()) { showToast('⚠️ Chưa có code để tách', true); return; }

  const original = splitBtn.innerHTML;
  splitBtn.innerHTML = '<span class="spinner"></span> Đang tách...';
  splitBtn.disabled = true;

  setTimeout(() => {
    try {
      const result = splitCode(raw);
      if (result.error) { showToast('❌ ' + result.error, true); return; }

      state.result = result;
      state.ready = true;
      state.activeTab = 'html';
      renderOutput();

      const a = result.html.split('\n').length;
      const b = result.css.split('\n').length;
      const c = result.js.split('\n').length;
      showToast(`✅ HTML: ${a} dòng | CSS: ${b} dòng | JS: ${c} dòng`);
    } catch (err) {
      console.error(err);
      showToast('❌ Lỗi: ' + err.message, true);
    } finally {
      splitBtn.innerHTML = original;
      splitBtn.disabled = false;
    }
  }, 40);
});

/* =========================================================
   DOWNLOAD ZIP (tự viết, không cần thư viện)
   ========================================================= */
downloadBtn.addEventListener('click', async () => {
  const files = [
    { name: 'index.html', content: state.result.html || '<!-- empty -->' },
    { name: 'style.css',  content: state.result.css  || '/* empty */' },
    { name: 'script.js',  content: state.result.js   || '// empty' }
  ];
  const active = files.filter(f => {
    if (f.name === 'index.html') return !!state.result.html;
    if (f.name === 'style.css')  return !!state.result.css;
    if (f.name === 'script.js')  return !!state.result.js;
  });

  if (active.length === 0) { showToast('⚠️ Chưa có dữ liệu', true); return; }
  if (active.length === 1) {
    downloadFile(active[0].name, active[0].content);
    showToast('⬇️ Đã tải ' + active[0].name);
    return;
  }

  const original = downloadBtn.innerHTML;
  downloadBtn.innerHTML = '<span class="spinner"></span> Đang nén...';
  downloadBtn.disabled = true;

  try {
    await new Promise(r => setTimeout(r, 80));
    const zip = createZip(files);
    const blob = new Blob([zip], { type: 'application/zip' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'code-splitter-output.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('✅ Đã tải ZIP (3 file)');
  } catch (err) {
    console.error(err);
    showToast('❌ Lỗi ZIP: ' + err.message, true);
  } finally {
    downloadBtn.innerHTML = original;
    downloadBtn.disabled = false;
  }
});

function downloadFile(name, content) {
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =========================================================
   CLEAR / SAMPLE / COPY
   ========================================================= */
clearBtn.addEventListener('click', () => {
  inputCode.value = '';
  state.input = '';
  state.fileName = '';
  state.result = { html: '', css: '', js: '' };
  state.ready = false;
  fileNameEl.textContent = 'Chưa chọn file';
  updateInputStats();
  output.classList.add('empty');
  output.textContent = '';
  downloadBtn.disabled = true;
  showToast('🗑️ Đã xóa');
});

copyBtn.addEventListener('click', async () => {
  const content = state.result[state.activeTab];
  if (!content) { showToast('⚠️ Không có nội dung', true); return; }
  try {
    await navigator.clipboard.writeText(content);
    copyBtn.textContent = '✅ Đã copy';
    setTimeout(() => copyBtn.textContent = '📋 Copy', 1500);
    showToast('✅ Đã copy ' + state.activeTab.toUpperCase());
  } catch {
    showToast('❌ Không copy được (cần HTTPS)', true);
  }
});

sampleBtn.addEventListener('click', () => {
  const sample = `<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang mẫu</title>
  <style>
    body { font-family: sans-serif; background: #667eea; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); text-align: center; }
    button { padding: 12px 28px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 Xin chào!</h1>
    <button id="btn">Click tôi</button>
    <p id="out"></p>
  </div>
  <script>
    let n = 0;
    document.getElementById('btn').addEventListener('click', () => {
      n++;
      document.getElementById('out').textContent = 'Đã click ' + n + ' lần';
    });
  <\/script>
</body>
</html>`;
  inputCode.value = sample;
  state.input = sample;
  fileNameEl.textContent = '📝 Code mẫu';
  updateInputStats();
  showToast('📝 Đã load mẫu, bấm "Tách code"');
});

/* =========================================================
   ZIP CREATOR (stored, không nén)
   ========================================================= */
function createZip(files) {
  const enc = new TextEncoder();
  const entries = files.map(f => {
    const nameBytes = enc.encode(f.name);
    const dataBytes = enc.encode(f.content);
    return { nameBytes, dataBytes, crc: crc32(dataBytes) };
  });

  let offset = 0;
  const locals = [];
  const centrals = [];

  entries.forEach(e => {
    const lh = new Uint8Array(30 + e.nameBytes.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, 0, true);
    lv.setUint16(12, 0, true);
    lv.setUint32(14, e.crc, true);
    lv.setUint32(18, e.dataBytes.length, true);
    lv.setUint32(22, e.dataBytes.length, true);
    lv.setUint16(26, e.nameBytes.length, true);
    lv.setUint16(28, 0, true);
    lh.set(e.nameBytes, 30);

    locals.push(lh, e.dataBytes);

    const ch = new Uint8Array(46 + e.nameBytes.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, e.crc, true);
    cv.setUint32(20, e.dataBytes.length, true);
    cv.setUint32(24, e.dataBytes.length, true);
    cv.setUint16(28, e.nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(e.nameBytes, 46);

    centrals.push(ch);
    offset += lh.length + e.dataBytes.length;
  });

  let cdSize = 0;
  centrals.forEach(c => cdSize += c.length);

  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  const total = offset + cdSize + 22;
  const zip = new Uint8Array(total);
  let p = 0;
  locals.forEach(l => { zip.set(l, p); p += l.length; });
  centrals.forEach(c => { zip.set(c, p); p += c.length; });
  zip.set(end, p);
  return zip;
}

const crcTable = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = (c >>> 8) ^ crcTable[(c ^ bytes[i]) & 0xFF];
  return (c ^ 0xFFFFFFFF) >>> 0;
}

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); splitBtn.click(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (!downloadBtn.disabled) downloadBtn.click(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') { e.preventDefault(); pickFileBtn.click(); }
});

/* =========================================================
   INIT
   ========================================================= */
updateInputStats();
renderOutput();
console.log('%c⚡ Code Splitter ready!', 'color:#6c8cff;font-weight:bold;font-size:14px;');
